name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked CPU environment
        run: uv sync --frozen --extra cpu
      - name: Syntax check
        run: uv run python -m compileall -q nanochat scripts tasks tests benchmarks
      - name: Unit tests
        run: uv run pytest -m "not slow" -q
